name: RSI Jenkins job bootstrap
on:
  push:
    branches: [codex/rsi-cd-bootstrap2-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-job:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Create isolated RSI Jenkins job
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > job.xml
          auth="$JENKINS_USER:$JENKINS_TOKEN"
          status=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --user "$auth" http://192.168.1.130:8080/job/rsi-tgbot-deploy/api/json || true)
          if [ "$status" = 200 ]; then echo 'rsi-tgbot-deploy already exists; refusing to replace it'; exit 0; fi
          test "$status" = 404
          curl --noproxy '*' --fail-with-body -sS --user "$auth" -H 'Content-Type: application/xml' --data-binary @job.xml 'http://192.168.1.130:8080/createItem?name=rsi-tgbot-deploy'
          echo 'RSI Jenkins job created; no deployment was queued'

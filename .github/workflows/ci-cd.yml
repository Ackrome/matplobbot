name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ackrome
  # Build records are diagnostic artifacts only. Uploading them can block a
  # self-hosted runner long after the image has already been pushed to GHCR.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  cancel:
    name: 'Cancel Other Workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
  # 1. Check what files changed
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            base:
              - 'requirements.in'
              - 'requirements.txt'
              - 'Dockerfile.base-python'
              - 'Dockerfile.base-worker'

  # 2. Validation Quality Gates
  validate:
    name: Validate (Lint, Tests, Types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify shared package version consistency
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          setup_text = Path("setup.py").read_text(encoding="utf-8")
          setup_match = re.search(r'version="(\d+\.\d+\.\d+)"', setup_text)
          if not setup_match:
              print("Could not read version from setup.py", file=sys.stderr)
              sys.exit(1)
          setup_version = setup_match.group(1)

          files = [
              Path("requirements.in"),
              Path("requirements.txt"),
              Path("fastapi_stats_app/requirements.txt"),
              Path("scheduler_app/requirements.txt"),
          ]
          pattern = re.compile(r"^matplobbot-shared==(\d+\.\d+\.\d+)$", re.MULTILINE)

          errors = []
          for req_file in files:
              content = req_file.read_text(encoding="utf-8")
              matches = pattern.findall(content)
              if not matches:
                  errors.append(f"{req_file}: missing matplobbot-shared pin")
                  continue
              unique = sorted(set(matches))
              if len(unique) != 1:
                  errors.append(f"{req_file}: conflicting pins {unique}")
                  continue
              if unique[0] != setup_version:
                  errors.append(
                      f"{req_file}: pin {unique[0]} does not match setup.py version {setup_version}"
                  )

          if errors:
              print("Shared package version consistency check failed:", file=sys.stderr)
              for err in errors:
                  print(f" - {err}", file=sys.stderr)
              sys.exit(1)

          print(f"Shared version is consistent across files: {setup_version}")
          PY
      - name: Verify Dockerfiles do not install shared package from PyPI
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          grep_guard = "grep -Ev '^[[:space:]]*matplobbot-shared=='"
          required_snippets = {
              "Dockerfile.base-python": [grep_guard],
              "Dockerfile.base-worker": [grep_guard],
              "fastapi_stats_app/Dockerfile": [grep_guard, "pip install --no-cache-dir /"],
              "scheduler_app/Dockerfile": [grep_guard, "pip install --no-cache-dir /"],
          }

          errors = []
          for file_path, snippets in required_snippets.items():
              content = Path(file_path).read_text(encoding="utf-8")
              for snippet in snippets:
                  if snippet not in content:
                      errors.append(f"{file_path}: missing snippet `{snippet}`")

          if errors:
              print(
                  "Dockerfile shared-package guard check failed. Expected local/source install guards:",
                  file=sys.stderr,
              )
              for err in errors:
                  print(f" - {err}", file=sys.stderr)
              sys.exit(1)

          print("Dockerfile guard check passed")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install local shared package first so validation does not depend on PyPI
          # having the same version already published.
          pip install -e .
          pip install -r requirements.txt -r fastapi_stats_app/requirements.txt -r scheduler_app/requirements.txt
          pip install -r requirements-validation.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint checks
        run: |
          ruff check . --select E9,F63,F7,F82
      - name: Unit and integration tests (with coverage gate)
        id: coverage_current
        env:
          JWT_SECRET_KEY: ci-test-secret
        run: |
          coverage run --branch -m unittest discover -s tests -v
          coverage report --skip-covered
          coverage xml -o coverage.xml
          coverage json -o coverage.json
          python - <<'PY'
          import json
          import os

          with open("coverage.json", encoding="utf-8") as f:
              percent = float(json.load(f)["totals"]["percent_covered"])

          print(f"Current coverage: {percent:.2f}%")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"percent={percent:.2f}\n")
          PY
      - name: Coverage trend vs base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          JWT_SECRET_KEY: ci-test-secret
          BASE_REF: ${{ github.base_ref }}
          CURRENT_COVERAGE: ${{ steps.coverage_current.outputs.percent }}
        run: |
          set -euo pipefail

          BASE_DIR="$(mktemp -d)"
          # Compare the same application-only scope even while base has legacy config.
          export COVERAGE_RCFILE="$PWD/pyproject.toml"
          cleanup() {
            git worktree remove "$BASE_DIR" --force >/dev/null 2>&1 || true
            rm -rf "$BASE_DIR"
          }
          trap cleanup EXIT

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add "$BASE_DIR" "origin/$BASE_REF"

          pushd "$BASE_DIR" >/dev/null
          # Coverage trend reporting should not fail the whole validation gate.
          if python -m pip install -e . >/dev/null 2>&1 && coverage run --branch -m unittest discover -s tests -v >/dev/null 2>&1; then
            coverage json --fail-under=0 -o coverage-base.json >/dev/null 2>&1
            BASE_COVERAGE="$(python -c "import json; print(f\"{float(json.load(open('coverage-base.json', encoding='utf-8'))['totals']['percent_covered']):.2f}\")")"
            DELTA="$(python -c "current=float('${CURRENT_COVERAGE}'); base=float('${BASE_COVERAGE}'); print(f'{current-base:+.2f}')")"
            {
              echo "### Coverage Trend (PR vs ${BASE_REF})"
              echo ""
              echo "| Base | PR | Delta |"
              echo "| --- | --- | --- |"
              echo "| ${BASE_COVERAGE}% | ${CURRENT_COVERAGE}% | ${DELTA}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Coverage Trend (PR vs ${BASE_REF})"
              echo ""
              echo "Coverage delta unavailable: base branch coverage run failed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          popd >/dev/null
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage.json
      - name: Type checks
        run: |
          mypy \
            fastapi_stats_app/auth.py \
            fastapi_stats_app/routers/studio_router.py \
            fastapi_stats_app/routers/ws_router.py \
            scheduler_app/config.py \
            scheduler_app/main.py \
            version_bumper.py \
            --ignore-missing-imports \
            --follow-imports=skip \
            --disable-error-code=import-untyped \
            --allow-untyped-defs \
            --allow-incomplete-defs
      - name: Dependency security audit
        run: |
          python scripts/build_audit_requirements.py
          # PYSEC-2024-277 is a disputed joblib deserialization advisory with no fixed
          # release as of 2026-05-20. It is pulled transitively by matplobblib via
          # scikit-learn, and this project does not load untrusted joblib pickle files.
          python -m pip_audit --strict -r audit-requirements.txt \
            --ignore-vuln PYSEC-2024-277

  # 3. Auto-Versioning
  auto-version-patch:
    name: Auto-Version Patch
    needs: [validate]
    if: |
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore(release)')
    outputs:
      new_version: ${{ steps.bumper.outputs.new_version }}
      commit_sha: ${{ steps.checkout.outputs.commit_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        id: checkout
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run Version Bumper
        id: bumper
        run: |
          python version_bumper.py patch
          git add setup.py requirements.in requirements.txt fastapi_stats_app/requirements.txt scheduler_app/requirements.txt
          git commit -m "chore(release): auto-version patch [skip ci]"
          git push origin HEAD:main

  # 4. Publish Shared Lib
  publish-shared-lib:
    name: Publish Shared Lib to PyPI
    needs: [validate, auto-version-patch]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  # 5. Build Base Images (Conditional)
  build-base-images:
    name: Build Base Images
    needs: [check-changes, validate]
    if: |
      github.event_name == 'push' &&
      needs.validate.result == 'success' &&
      needs.check-changes.outputs.base == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Python Base
      - name: Build and Push Base Python
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.base-python
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-base-python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Worker Base (Heavy)
      - name: Build and Push Base Worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.base-worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-base-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 6. Build Service Images (Dependent on Validation + Base Image Logic)
  build-services:
    name: Build Service Images
    needs: [check-changes, validate, build-base-images]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.validate.result == 'success' &&
      (needs.build-base-images.result == 'success' || needs.build-base-images.result == 'skipped') &&
      (needs.check-changes.result == 'success')
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up RC Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Maintenance Cleanup
        run: |
          docker image prune -af --filter "until=168h"
          docker container prune -f --filter "until=24h"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # WORKER (Uses Base Worker)
      - name: Build Worker
        id: image_worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-worker:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # BOT (Uses Base Python)
      - name: Build Bot
        id: image_bot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bot
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-bot:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-bot:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # API (Uses Base Python)
      - name: Build API
        id: image_api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./fastapi_stats_app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-api:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # SCHEDULER (Uses Base Python)
      - name: Build Scheduler
        id: image_scheduler
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scheduler_app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-scheduler:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/matplobbot-scheduler:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Bind immutable release and run real-service RC acceptance
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-validation.txt
          .venv/bin/python scripts/release_manifest.py create --commit "${{ github.sha }}" --ci-run "${{ github.run_id }}" --output release-manifest.json \
            --image "bot=ghcr.io/ackrome/matplobbot-bot@${{ steps.image_bot.outputs.digest }}" \
            --image "api=ghcr.io/ackrome/matplobbot-api@${{ steps.image_api.outputs.digest }}" \
            --image "scheduler=ghcr.io/ackrome/matplobbot-scheduler@${{ steps.image_scheduler.outputs.digest }}" \
            --image "worker=ghcr.io/ackrome/matplobbot-worker@${{ steps.image_worker.outputs.digest }}"
          .venv/bin/python scripts/rc_acceptance.py --manifest release-manifest.json --output rc-acceptance.json
          .venv/bin/python scripts/release_manifest.py attest release-manifest.json --report rc-acceptance.json --output release-manifest-accepted.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-release-${{ github.sha }}
          overwrite: true
          path: |
            release-manifest*.json
            rc-acceptance.json
            rc-acceptance.log

      - name: Soft Cleanup
        if: always()
        run: |
          docker image prune -af --filter "until=168h"
          docker container prune -f --filter "until=24h"

  # 7. Deploy
  trigger-deployment:
    name: Trigger Jenkins Deployment
    needs: [build-services]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.build-services.result == 'success'
    runs-on: self-hosted
    env:
      JENKINS_LAN_URL: ${{ vars.JENKINS_LAN_URL || 'http://192.168.1.130:8080' }}
      APP_VM_LAN_HOST: ${{ vars.APP_VM_LAN_HOST || '192.168.1.40' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: accepted-release-${{ github.sha }}
      - name: Trigger Jenkins Job via cURL
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          if [[ "$JENKINS_LAN_URL" =~ ^(https?)://([^/:]+)(:([0-9]+))?/?$ ]]; then
            JENKINS_SCHEME="${BASH_REMATCH[1]}"
            JENKINS_HOST="${BASH_REMATCH[2]}"
            JENKINS_PORT="${BASH_REMATCH[4]}"
          else
            echo "ERROR: JENKINS_LAN_URL must be an HTTP(S) origin without a path."
            exit 1
          fi

          if [ -z "$JENKINS_PORT" ]; then
            if [ "$JENKINS_SCHEME" = "https" ]; then
              JENKINS_PORT=443
            else
              JENKINS_PORT=80
            fi
          fi

          JENKINS_LAN_IP="$(bash scripts/resolve_private_ipv4.sh "$JENKINS_HOST")"
          APP_VM_LAN_IP="$(bash scripts/resolve_private_ipv4.sh "$APP_VM_LAN_HOST")"

          python3 scripts/jenkins_release_parameters.py \
            --job-url "$JENKINS_SCHEME://$JENKINS_HOST:$JENKINS_PORT/job/matplobbot-deploy" \
            --resolve-ip "$JENKINS_LAN_IP" --apply

          # Existing Pipeline jobs may drop unknown parameters before a new
          # Jenkinsfile has installed its properties. Never bootstrap by deploying.
          curl --fail --show-error --silent \
            --noproxy "$JENKINS_HOST,$JENKINS_LAN_IP" \
            --resolve "$JENKINS_HOST:$JENKINS_PORT:$JENKINS_LAN_IP" \
            --user "$JENKINS_USER:$JENKINS_TOKEN" \
            "$JENKINS_SCHEME://$JENKINS_HOST:$JENKINS_PORT/job/matplobbot-deploy/api/json?tree=property%5BparameterDefinitions%5Bname%5D%5D" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); names={p["name"] for prop in data.get("property",[]) for p in prop.get("parameterDefinitions",[])}; missing={"SOURCE_COMMIT","RELEASE_MANIFEST_B64"}-names; sys.exit("Install the Jenkins immutable-release parameter definitions before triggering deployment; see docs/release-runbook.md. Missing: " + ", ".join(sorted(missing)) if missing else 0)'

          curl --fail-with-body --show-error --silent \
            --noproxy "$JENKINS_HOST,$JENKINS_LAN_IP" \
            --resolve "$JENKINS_HOST:$JENKINS_PORT:$JENKINS_LAN_IP" \
            -X POST "$JENKINS_SCHEME://$JENKINS_HOST:$JENKINS_PORT/job/matplobbot-deploy/buildWithParameters" \
            --user "$JENKINS_USER:$JENKINS_TOKEN" \
            --data-urlencode "SOURCE_COMMIT=${{ github.sha }}" \
            --data-urlencode "RELEASE_MANIFEST_B64=$(base64 -w0 release-manifest-accepted.json)" \
            --data-urlencode "DEPLOY_HOST=$APP_VM_LAN_IP"

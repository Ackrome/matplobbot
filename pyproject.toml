[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
allow_untyped_defs = true
allow_incomplete_defs = true
warn_unused_ignores = true
exclude = "(^alembic/versions/)"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bot", "fastapi_stats_app", "scheduler_app", "shared_lib"]

[tool.coverage.report]
# 2026-10-10 measured application-only baseline: 50.30%, including unimported
# modules. Tests and offline research scripts are outside this product gate.
fail_under = 50
precision = 2
# OpenCV's bootstrap compiles package configuration with basename-only filenames.
# These two root paths are virtual; keep real app config.py modules in coverage.
omit = ["./config.py", "./config-3.py"]

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # 1. ПЕРЕНАПРАВЛЕНИЕ ВСЕХ API ЗАПРОСОВ (календари, расписание, статистика, авторизация)
    location /api/ {
        # Проксируем запрос в контейнер FastAPI по его внутреннему имени и порту
        set $stats_api http://mpb-fastapi-stats:9583;
        proxy_pass $stats_api;

        # Передаем правильные заголовки, чтобы FastAPI не паниковал
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live API streams share the same backend as REST and must preserve Upgrade.
    location /ws/ {
        set $stats_api http://mpb-fastapi-stats:9583;
        proxy_pass $stats_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # 2. ОСТАЛЬНОЙ САЙТ (лэндинг, расписание, логин)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

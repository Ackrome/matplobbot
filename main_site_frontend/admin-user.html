<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin user details | Matplobbot</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=6">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-5xl px-4 py-8">
    <div class="mb-6 flex items-center justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-blue-600">Admin only</p>
        <h1 class="text-2xl font-bold">User details</h1>
      </div>
      <a class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm hover:bg-slate-100" href="/stats">Back to stats</a>
    </div>
    <section id="status" class="rounded-xl border border-slate-200 bg-white p-5 text-sm text-slate-600" role="status" aria-live="polite">Loading…</section>
    <section id="profile" class="mt-4 hidden rounded-xl border border-slate-200 bg-white p-5"></section>
    <section id="messageComposer" class="mt-4 hidden rounded-xl border border-blue-200 bg-blue-50/60 p-5">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h2 class="font-semibold">Telegram chat</h2>
          <p class="mt-1 text-sm text-slate-600">Incoming messages and replies from the bot appear here.</p>
        </div>
        <span id="messageSyncStatus" class="rounded-full bg-white px-3 py-1 text-xs font-medium text-blue-700">Updating automatically</span>
      </div>
      <div id="messageList" class="mt-4 max-h-[32rem] min-h-[10rem] space-y-3 overflow-y-auto rounded-xl border border-slate-200 bg-slate-50 p-4" aria-live="polite">
        <p id="messageEmpty" class="py-10 text-center text-sm text-slate-500">No messages yet.</p>
      </div>
      <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
        <button id="loadOlderMessages" type="button" class="focus-ring hidden rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100">Load older messages</button>
        <span id="messageHistoryMeta" class="text-xs text-slate-500"></span>
      </div>
      <form id="messageForm" class="mt-5 space-y-3 border-t border-blue-200 pt-4">
        <h3 class="text-sm font-semibold text-slate-800">Reply as bot</h3>
        <label class="sr-only" for="messageInput">Message text</label>
        <textarea id="messageInput" name="message" rows="5" maxlength="4096" required class="focus-ring w-full resize-y rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900" placeholder="Write a message…"></textarea>
        <div class="flex flex-wrap items-center justify-between gap-3">
          <span id="messageCounter" class="text-xs text-slate-500">0 / 4096</span>
          <button id="sendMessageButton" type="submit" class="focus-ring rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">Send from bot</button>
        </div>
        <p id="messageStatus" class="hidden text-sm" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section id="actions" class="mt-4 hidden overflow-hidden rounded-xl border border-slate-200 bg-white">
      <div class="border-b border-slate-200 px-5 py-3"><h2 class="font-semibold">Recent actions</h2></div>
      <div class="overflow-auto"><table class="w-full min-w-[640px] text-left text-sm"><thead class="bg-slate-50"><tr><th class="px-5 py-3">Time</th><th class="px-5 py-3">Type</th><th class="px-5 py-3">Details</th></tr></thead><tbody id="actionsBody"></tbody></table></div>
    </section>
  </main>
  <script src="/js/runtime_config.js"></script>
  <script src="/js/admin-user.js"></script>
</body>
</html>
